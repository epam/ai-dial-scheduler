name: PR Workflow

on:
  pull_request:
    branches: [development, release-*]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  run_tests:
    uses: epam/ai-dial-ci/.github/workflows/python_docker_pr.yml@eaa6d99d6471b7a3f7369d1d11a90f8d57235224 # 5.1.0
    with:
      python-package-manager: uv
      python-version: "3.14"
    secrets: inherit

name: Release Workflow

on:
  push:
    branches: [development, release-*]
  workflow_dispatch:
    inputs:
      promote:
        type: boolean
        default: false
        description: Promote release to stable (for release-* branches only)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    uses: epam/ai-dial-ci/.github/workflows/python_docker_release.yml@eaa6d99d6471b7a3f7369d1d11a90f8d57235224 # 5.1.0
    with:
      python-package-manager: uv
      python-version: "3.14"
      promote: ${{ github.event_name == 'workflow_dispatch' && inputs.promote }}
    secrets: inherit

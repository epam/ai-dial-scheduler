services:
  themes:
    image: epam/ai-dial-chat-themes:latest
    ports:
      - "3001:8080"

  chat:
    ports:
      - "3000:3000"
    image: epam/ai-dial-chat:latest
    depends_on:
      - themes
      - core
    environment:
      NEXTAUTH_SECRET: "secret"
      THEMES_CONFIG_HOST: "http://themes:8080"
      DIAL_API_HOST: "http://core:8080"
      DIAL_API_KEY: "dial_api_key"
      ENABLED_FEATURES: "conversations-section,prompts-section,top-settings,top-clear-conversation,top-chat-info,top-chat-model-settings,empty-chat-settings,header,footer,request-api-key,report-an-issue,likes,conversations-sharing,input-files,attachments-manager,prompts-sharing,prompts-publishing,conversations-publishing,custom-logo,input-links,custom-applications,message-templates,marketplace,quick-apps,code-apps,applications-sharing,marketplace-table-view,toolsets"
      AUTH_DISABLED: 'true'
      DEFAULT_MODEL: "gpt-5.1-2025-11-13"

  redis:
    image: redis:7.2.4-alpine3.19
    restart: always
    command: >
      redis-server
      --maxmemory 2000mb
      --maxmemory-policy volatile-lfu
      --save ""
      --appendonly no
      --loglevel warning
    mem_limit: 2200M

  core:
    ports:
      - "8080:8080"
    image: epam/ai-dial-core:latest
    environment:
      'AIDIAL_SETTINGS': '/opt/settings/settings.json'
      'JAVA_OPTS': '-Dgflog.config=/opt/settings/gflog.xml'
      'aidial.config.files': '["/opt/config/config.json"]'
      'aidial.redis.singleServerConfig.address': 'redis://redis:6379'

      'aidial.identityProviders.keycloak.jwksUrl': 'http://keycloak:8900/realms/dial/protocol/openid-connect/certs'
      'aidial.identityProviders.keycloak.rolePath': 'roles'
      'aidial.access.admin.rules': '[{"source": "roles", "function": "EQUAL", "targets": ["admin"]}]'
      'aidial.identityProviders.keycloak.loggingKey': 'email'
      'aidial.identityProviders.keycloak.loggingSalt': 'loggingSalt'

    depends_on:
      - redis
    volumes:
      - ./dial_conf/settings:/opt/settings
      - ./dial_conf/core:/opt/config
      - core-logs:/app/log

  adapter-dial:
    image: epam/ai-dial-adapter-dial:latest
    environment:
      DIAL_URL: "http://core:8080"
      LOG_LEVEL: "INFO"


  keycloak:
    image: keycloak/keycloak:26.3
    user: root
    command: [ "start-dev", "--import-realm", "--http-port=8900", "--hostname-backchannel-dynamic=true" ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8900
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
      KC_PROXY: edge
      QUARKUS_HTTP_LIMITS_MAX_HEADER_SIZE: 64k
      KC_INITIALIZE_EMPTY: 'true'
      KC_FEATURE_CACHE_STACK: 'true'
      KC_DB_PASSWORD: 'keycloak_password'
      KC_ADMIN_PASSWORD: 'admin'
      AUTH_KEYCLOAK_SECRET: 'keycloak_secret'
    ports:
      - "8900:8900"
    volumes:
      - ./dial_conf/keycloak/data:/opt/keycloak/data
      - ./dial_conf/keycloak/import/realm-config.json:/opt/keycloak/data/import/realm-config.json
    restart: always

volumes:
  core-logs:

include:
  - project: GitLab/ci
    ref: 3.2.1
    file: docker/docker-generic.gitlab-ci.yml


variables:
  # CI Images (for custom jobs)
  PYTHON_IMAGE: "dockerhub.deltixhub.com/python:3.13"

  # Python build variables
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

  # Docker configuration (for template)
  DOCKER_PATH: dial-scheduler/images/dial-scheduler
  DOCKERFILE_PATH: "."
  DOCKER_ADDITIONAL_TAG: ""
  DOCKER_BUILD_ARGS: ""

stages:
  - test
  - build
  - scan
  - deploy
  - publish



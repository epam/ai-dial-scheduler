include:
  - project: GitLab/ci
    ref: 3.2.2
    file: docker/docker-generic.gitlab-ci.yml


variables:
  DOCKER_PATH: dial-scheduler/images/dial-scheduler
  PYTHON_IMAGE: "dockerhub.deltixhub.com/python:3.13"
  TRIVY_VERSION: 0.69.1
  TRIVY_DISABLE_VEX_NOTICE: "true"


stages:
  - test
  - build
  - scan
  - publish
  - deploy


"Tag branch":
  stage: build
  rules:
    - if: "$CI_COMMIT_REF_SLUG =~ /^release-/ && $CI_COMMIT_MESSAGE !~ /^RobotBuild/"

test:
  image: ${PYTHON_IMAGE}
  stage: test
  before_script:
    - python --version ; pip --version
    - pip install uv
    - uv sync --all-extras --dev
  script:
    - uv run pytest --cov=src --cov-report=xml:coverage.xml --junitxml=report.xml
  artifacts:
    paths:
      - report.xml
      - coverage.xml
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    when: always
    expire_in: 1 week
  rules:
    - if: "$CI_PIPELINE_SOURCE == 'merge_request_event'"
    - if: "$CI_COMMIT_BRANCH == 'development'"
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .cache/pip
      - .venv
      - .poetry
  tags:
    - Linux
    - DockerExecutor

lint:
  image: ${PYTHON_IMAGE}
  stage: test
  before_script:
    - python --version ; pip --version
    - pip install uv
    - uv sync --all-extras --dev
  script:
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run mypy --show-error-codes src
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .cache/pip
      - venv/
  tags:
    - DockerExecutor
    - aws-large
  rules:
    - if: "$CI_PIPELINE_SOURCE == 'merge_request_event'"
    - if: "$CI_COMMIT_BRANCH == 'development'"
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH =~ /feature|hotfix/'

build:
  rules:
    - if: $CI_COMMIT_TAG
      variables:
        DOCKER_ADDITIONAL_TAGS: "latest"
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      variables:
        DOCKER_ADDITIONAL_TAGS: "development"

trigger_deploy_migrations:
  stage: deploy
  inherit:
    variables: false
  trigger:
    project: Clients/dial/dev/dial-scheduler/dial-scheduler-migrations
    strategy: depend
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

trigger_deploy_api:
  stage: deploy
  inherit:
    variables: false
  trigger:
    project: Clients/dial/dev/dial-scheduler/dial-scheduler-api
  needs:
    - trigger_deploy_migrations
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

trigger_deploy_worker:
  stage: deploy
  inherit:
    variables: false
  trigger:
    project: Clients/dial/dev/dial-scheduler/dial-scheduler-worker
  needs:
    - trigger_deploy_migrations
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

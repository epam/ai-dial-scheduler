include:
  - project: GitLab/ci
    ref: 3.3.2
    file: docker/docker-application-generic.gitlab-ci.yml
    inputs:
      docker-path: "dial-scheduler/images/dial-scheduler"

variables:
  PYTHON_IMAGE: "dockerhub.deltixhub.com/python:3.13"

test:
  image: ${PYTHON_IMAGE}
  stage: test
  before_script:
    - python --version ; pip --version
    - pip install uv
    - uv sync --all-extras --dev
  script:
    - uv run pytest --cov=src --cov-report=xml:coverage.xml --junitxml=report.xml
  artifacts:
    paths:
      - report.xml
      - coverage.xml
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    when: always
    expire_in: 1 week
  rules:
    - if: "$CI_PIPELINE_SOURCE == 'merge_request_event'"
    - if: "$CI_COMMIT_BRANCH == 'development'"
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .cache/pip
      - .venv
      - .poetry
  tags:
    - Linux
    - DockerExecutor

lint:
  image: ${PYTHON_IMAGE}
  stage: test
  before_script:
    - python --version ; pip --version
    - pip install uv
    - uv sync --all-extras --dev
  script:
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run mypy --show-error-codes src
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .cache/pip
      - venv/
  tags:
    - AWS
    - DockerExecutor
  rules:
    - if: "$CI_PIPELINE_SOURCE == 'merge_request_event'"
    - if: "$CI_COMMIT_BRANCH == 'development'"
    - if: '$CI_COMMIT_TAG'

trigger_deploy_api:
  stage: promote
  inherit:
    variables: false
  trigger:
    project: Clients/dial/dev/dial-scheduler/dial-scheduler-api
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

trigger_deploy_worker:
  stage: promote
  inherit:
    variables: false
  trigger:
    project: Clients/dial/dev/dial-scheduler/dial-scheduler-worker
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

trigger_deploy_rds:
  stage: promote
  inherit:
    variables: false
  trigger:
    project: Clients/dial/dev/dial-scheduler/dial-scheduler-rds
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

[project]
name = "aidial-scheduler"
version = "0.1.0"
description = "Dial Scheduler backend"
readme = "README.md"
requires-python = ">=3.14,<3.15"

authors = [
    { name = "Your Name", email = "your.email@example.com" },
]

dependencies = [
    "aidial-sdk==0.37.0",
    "apscheduler~=3.11",
    "sqlalchemy[asyncio]==2.0.50",
    "sqlmodel==0.0.38",
    "alembic==1.18.4",
    "asyncpg==0.31.0",
    "psycopg2==2.9.12",
    "pydantic-settings==2.14.1",
    "structlog==26.1.0",
    "httpx==0.28.1",
    "uvicorn==0.49.0",
    "openai>=1.0.0,<2",
    "httpx-sse>=0.4.0,<1",
]


[dependency-groups]
dev = [
    "psycopg2-binary==2.9.12",
    "pre-commit>=4.6.0,<5",
    "ruff>=0.15.16,<1",
    "mypy>=2.1.0,<3",
    "pytest>=9.0.3,<10",
    "pytest-cov>=7.1.0,<8",
    "pytest-mock>=3.15.1,<4",
    "pytest-sugar>=1.1.1,<2",
    "pytest-asyncio>=1.4.0,<2",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false


[tool.ruff]
line-length = 120
src = ["src", "tests"]
target-version = "py314"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
force-sort-within-sections = true
known-first-party = ["src"]
lines-after-imports = 2
split-on-trailing-comma = true


[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"


[tool.mypy]
python_version = "3.14"
namespace_packages = true
show_error_codes = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

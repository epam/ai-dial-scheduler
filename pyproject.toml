[project]
name = "aidial-scheduler"
version = "0.1.0"
description = "Dial Scheduler backend"
readme = "README.md"
requires-python = ">=3.14,<3.15"

authors = [
    { name = "Your Name", email = "ihor_lahutin@epam.com" },
]

dependencies = [
    "aidial-sdk[telemetry]==0.37.0",
    "apscheduler~=3.11",
    "sqlalchemy[asyncio]==2.0.50",
    "sqlmodel==0.0.38",
    "alembic==1.18.4",
    "asyncpg==0.31.0",
    "psycopg2==2.9.12",
    "pydantic-settings==2.14.1",
    "structlog==26.1.0",
    "httpx==0.28.1",
    "uvicorn==0.49.0",
    "openai>=1.0.0,<2",
    "httpx-sse>=0.4.0,<1",
    "fastmcp>=3.4.2",
    "cloud-sql-python-connector[pg8000]>=1.13.0,<2",
    "azure-identity>=1.19.0,<2",
]


[dependency-groups]
dev = [
    "psycopg2-binary==2.9.12",
    "pre-commit>=4.6.0,<5",
    "ruff>=0.15.16,<1",
    "mypy>=2.1.0,<3",
    "pytest>=9.0.3,<10",
    "pytest-cov>=7.1.0,<8",
    "pytest-mock>=3.15.1,<4",
    "pytest-sugar>=1.1.1,<2",
    "pytest-asyncio>=1.4.0,<2",
    "python-keycloak>=7.1.1",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
constraint-dependencies = [
    "starlette>=1.3.1",
    "mcp>=1.28.1",
    "pyasn1>=0.6.4",
    # Transitive pins raising CVE-flagged versions above their fix. Each is pulled in by a
    # dependency that permits the vulnerable range, so the floor is set here rather than by
    # adding a direct dependency.
    "aiohttp>=3.14.3",       # CVE-2026-69244, via cloud-sql-python-connector
    "cryptography>=50.0.0",  # CVE-2026-69247, CVE-2026-69249, via azure-identity/google-auth/msal
]


[tool.ruff]
line-length = 120
src = ["src", "tests"]
target-version = "py314"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
force-sort-within-sections = true
known-first-party = ["src"]
lines-after-imports = 2
split-on-trailing-comma = true


[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"


[tool.mypy]
python_version = "3.14"
namespace_packages = true
show_error_codes = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[project]
name = "aidial-scheduler"
version = "0.0.0"
description = "Scheduling service for AI DIAL: runs chat completion, responses, REST and SSE targets on cron and date triggers"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"

dependencies = [
    "aidial-sdk[telemetry]==0.37.0",
    "apscheduler~=3.11",
    "sqlalchemy[asyncio]==2.0.50",
    "sqlmodel==0.0.38",
    "alembic==1.18.4",
    "asyncpg==0.31.0",
    "psycopg2==2.9.12",
    "pydantic-settings==2.14.2",
    "structlog==26.1.0",
    "httpx==0.28.1",
    "uvicorn==0.49.0",
    "openai>=1.0.0,<2",
    "httpx-sse>=0.4.0,<1",
    "fastmcp>=3.4.10,<4",
    "cloud-sql-python-connector[pg8000]>=1.13.0,<2",
    "azure-identity>=1.19.0,<2",
    "boto3>=1.40.0,<2",
]

[project.urls]
Homepage = "https://dialx.ai"
Repository = "https://github.com/epam/ai-dial-scheduler"
Issues = "https://github.com/epam/ai-dial-scheduler/issues"


[dependency-groups]
dev = [
    "psycopg2-binary==2.9.12",
    "pre-commit>=4.6.0,<5",
    "ruff>=0.15.16,<1",
    "mypy>=2.1.0,<3",
    "pytest>=9.0.3,<10",
    "pytest-cov>=7.1.0,<8",
    "pytest-mock>=3.15.1,<4",
    "pytest-sugar>=1.1.1,<2",
    "pytest-asyncio>=1.4.0,<2",
    "python-keycloak>=7.1.1",
]


[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.uv]
package = false
constraint-dependencies = [
    "starlette>=1.3.1",
    "mcp>=1.28.1",
    "pyasn1>=0.6.5",
    # Transitive pins raising CVE-flagged versions above their fix. Each is pulled in by a
    # dependency that permits the vulnerable range, so the floor is set here rather than by
    # adding a direct dependency.
    "aiohttp>=3.14.4",       # CVE-2026-69244, CVE-2026-111064, CVE-2026-111066, via cloud-sql-python-connector
    "cryptography>=50.0.0",  # CVE-2026-69247, CVE-2026-69249, via azure-identity/google-auth/msal
    "anyio>=4.14.2",         # CVE-2026-63374, via httpx/starlette/mcp/openai
    "pyjwt>=2.14.0",         # CVE-2026-102266/67/68/71/72/73, transitive
    "urllib3>=2.8.0",        # CVE-2026-97687, CVE-2026-97689, via boto3/botocore/requests
    "authlib>=1.9.1",        # CVE-2026-96760, CVE-2026-114615/16, CVE-2026-116672, via fastmcp-slim
    "certifi>=2026.10.18",   # GHSA-6q48-6c7w-9gw2, via httpx/httpcore/requests
    "dnspython>=2.9.0",      # CVE-2026-114605, via cloud-sql-python-connector/email-validator
    "joserfc>=1.7.5",        # CVE-2026-119283, via authlib/fastmcp-slim
    "fastmcp-slim>=3.4.10,<4",  # GHSA-7xgj-8392-5q4r, via fastmcp
    "opentelemetry-api>=1.45.1",  # CVE-2026-114603, via aidial-sdk[telemetry]/opentelemetry-*
    "multidict>=6.9.1,<7",   # CVE-2026-104874, via aiohttp/yarl
    "mako>=1.4.2",           # CVE-2026-102991, via alembic
    "virtualenv>=21.14.9",   # CVE-2026-102925 and 18 more, dev-only via pre-commit
    "filelock>=4.2.1",       # CVE-2026-112907 and 8 more, dev-only via virtualenv/python-discovery
    # pyasn1 (above): CVE-2026-119194/95/96/97, via pyasn1-modules
]


[tool.ruff]
line-length = 120
src = ["src", "tests"]
target-version = "py314"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
force-sort-within-sections = true
known-first-party = ["src"]
lines-after-imports = 2
split-on-trailing-comma = true


[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"


[tool.mypy]
python_version = "3.14"
namespace_packages = true
show_error_codes = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

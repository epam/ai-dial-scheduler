# Local development stack for DIAL Scheduler.
# Image tags are intentionally floating (`latest` for chat/themes, `development` for core and adapters) to follow
# the newest DIAL builds. For a reproducible setup, pin each epam/ai-dial-* image to a released tag and verify that
# the per-user credentials flow (README.md, "Per-User Credentials") still works with those versions.
services:

  themes:
    image: epam/ai-dial-chat-themes:latest
    platform: linux/amd64
    ports:
      - "3101:8080"

  redis:
    image: redis:7.2.4-alpine3.19
    restart: always
    ports:
      - "6600:6379"
    command: >
      redis-server
      --maxmemory 2000mb
      --maxmemory-policy volatile-lfu
      --save ""
      --appendonly no
      --loglevel warning
    mem_limit: 2200M

  chat:
    image: epam/ai-dial-chat:latest
    platform: linux/amd64
    environment:
      AUTH_KEYCLOAK_CLIENT_ID: "dial-chat"
      AUTH_KEYCLOAK_DIAL_ROLES_FIELD: "resource_access.dial-chat.roles"
      AUTH_KEYCLOAK_HOST: "http://keycloak:${KC_PORT}/realms/dial/"
      AUTH_KEYCLOAK_SECRET: "${AUTH_KEYCLOAK_SECRET}"
      DIAL_API_HOST: "http://core:8080"
      ENABLED_FEATURES: "conversations-section,prompts-section,top-settings,top-clear-conversation,top-chat-info,top-chat-model-settings,empty-chat-settings,header,footer,request-api-key,report-an-issue,likes,conversations-sharing,input-files,attachments-manager,prompts-sharing,prompts-publishing,conversations-publishing,custom-logo,input-links,custom-applications,message-templates,marketplace,quick-apps,code-apps,applications-sharing,marketplace-table-view"
      KEEP_ALIVE_TIMEOUT: ${CHAT_KEEP_ALIVE_TIMEOUT:-20000}
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET}"
      THEMES_CONFIG_HOST: "http://themes:8080"
      NEXTAUTH_URL: "http://localhost:${DIAL_CHAT_HOST_PORT}"
      NEXTAUTH_URL_INTERNAL: "http://chat:3000"
      ALLOWED_IFRAME_ORIGINS: http://localhost:3301
      ALLOWED_IFRAME_SOURCES: http://localhost:3301

    ports:
      - "${DIAL_CHAT_HOST_PORT}:3000"
    depends_on:
      themes:
        condition: service_started
      core:
        condition: service_started
      keycloak:
        condition: service_started
    restart: always

  core:
    image: epam/ai-dial-core:development
    platform: linux/amd64
    environment:
      'JAVA_OPTS': '-Dgflog.config=/opt/settings/gflog.xml'
      'proxy.config.files': '["/app/config/config.json"]'
      'aidial.identityProviders.keycloak.jwksUrl': 'http://keycloak:${KC_PORT}/realms/dial/protocol/openid-connect/certs'
      'aidial.identityProviders.keycloak.rolePath': 'roles'
      'aidial.access.admin.rules': '[{"source": "roles", "function": "EQUAL", "targets": ["admin"]}]'
      'aidial.identityProviders.keycloak.loggingKey': 'email'
      'aidial.identityProviders.keycloak.loggingSalt': 'loggingSalt'
      # Offline credentials client (DIAL_NATIVE external services). Core redeems a stored
      # refresh token at the token endpoint, so that one must resolve from inside the
      # container; the authorization endpoint is opened by the browser, so it must not.
      'aidial.identityProviders.keycloak.offlineClient.clientId': 'dial-credentials-manager'
      'aidial.identityProviders.keycloak.offlineClient.clientSecret': 'offline-manager-secret'
      'aidial.identityProviders.keycloak.offlineClient.authorizationEndpoint': 'http://localhost:${KC_PORT}/realms/dial/protocol/openid-connect/auth'
      'aidial.identityProviders.keycloak.offlineClient.tokenEndpoint': 'http://host.docker.internal:${KC_PORT}/realms/dial/protocol/openid-connect/token'
      'aidial.identityProviders.keycloak.offlineClient.redirectUri': 'http://localhost:${DIAL_CHAT_HOST_PORT}/callback'
      'aidial.encryption.secret': '${DIAL_CORE_ENCRYPTION_SECRET}'
      'aidial.encryption.key': '${DIAL_CORE_ENCRYPTION_KEY}'
      'aidial.redis.singleServerConfig.address': 'redis://redis:6379'
      'aidial.storage.provider': 'filesystem'
      'aidial.storage.prefix': 'core'
      'aidial.storage.bucket': 'dial'
      'aidial.storage.createBucket': 'true'
      'aidial.storage.overrides': '{"jclouds.filesystem.basedir": "data"}'
      'aidial.applications.includeCustomApps': 'true'
      'aidial.resources.compressionMinSize': 2056
    ports:
      - "${DIAL_CORE_HOST_PORT}:8080"
    volumes:
      - ${DIAL_DIR:-.}/core:/app/config
      - ${DIAL_DIR:-.}/core-logs:/app/log
      - ${DIAL_DIR:-.}/core-data:/app/data
      - ./settings:/opt/settings
    depends_on:
      - redis
    restart: always

  adapter-dial:
    image: epam/ai-dial-adapter-dial:development
    platform: linux/amd64
    environment:
      DIAL_URL: "http://core:8080"

  adapter-openai:
    image: epam/ai-dial-adapter-openai:development
    platform: linux/amd64
    environment:
      DIAL_URL: "http://core:8080"

  keycloak:
    image: keycloak/keycloak:26.3
    user: root
    command: ["start-dev", "--import-realm", "--http-port=${KC_PORT}", "--hostname-backchannel-dynamic=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_HOSTNAME: http://localhost:${KC_PORT}
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
      KC_PROXY: edge
      QUARKUS_HTTP_LIMITS_MAX_HEADER_SIZE: 64k
      KC_INITIALIZE_EMPTY: 'true'
      KC_FEATURE_CACHE_STACK: 'true'
    ports:
      - "${KC_PORT}:${KC_PORT}"
    volumes:
      - ./keycloak/data:/opt/keycloak/data
      - ./keycloak/import/realm-config.json:/opt/keycloak/data/import/realm-config.json
    restart: always
